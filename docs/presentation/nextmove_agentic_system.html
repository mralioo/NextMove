<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextMove · how the agent team works</title>
<style>
:root{
  --bg:#020B0E; --panel:rgba(6,24,31,.92); --line:rgba(0,229,212,.16); --text:#F1F7F6; --muted:#8FB0BA; --dim:#4D6B75;
  --teal:#00E5D4; --gold:#F5C518; --orange:#FF6A2B; --blue:#4EA1FF; --green:#3DDC97; --violet:#B48CFF; --red:#FF5C5C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% -10%,#0a2a35 0%,#031218 45%,#01070A 100%) fixed;background-color:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:10px 22px;border-bottom:1px solid var(--line);background:rgba(2,11,14,.7);flex-wrap:wrap}
header img{height:52px;width:auto;object-fit:contain;background:#fff;border-radius:10px;box-shadow:0 0 18px rgba(0,229,212,.28)}
header .sub{color:var(--muted);font-size:13px;max-width:340px;line-height:1.3}
nav{display:flex;gap:6px;margin:0 auto;flex-wrap:wrap}
nav button,.ctl button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 16px;border-radius:999px;font:600 14px inherit;cursor:pointer;transition:.2s}
nav button:hover,.ctl button:hover{color:var(--text);background:rgba(255,255,255,.06)}
nav button.on{background:rgba(0,229,212,.12);border-color:rgba(0,229,212,.4);color:var(--teal);box-shadow:0 0 14px rgba(0,229,212,.2)}
nav button b{opacity:.55;margin-right:6px}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{border-color:var(--line);padding:7px 13px}
.ctl button.on{color:var(--gold);border-color:rgba(245,197,24,.5)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:14px 22px 8px}
#stage{position:relative;border:1px solid var(--line);border-radius:18px;background:rgba(3,14,19,.55);overflow:hidden;min-height:0}
#stage svg{width:100%;height:100%;display:block}
#cards{position:absolute;inset:0;padding:22px 26px;display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,minmax(0,1fr)) auto;gap:14px;overflow:auto}
aside{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px 22px;overflow:auto}
aside .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:700}
aside h2{font-size:26px;line-height:1.15;margin:6px 0 10px;letter-spacing:-.01em}
aside p{font-size:16.5px;line-height:1.5;color:#D3E4E8}
aside .grp{margin-top:14px}
aside .grp h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
aside .grp.never h4{color:var(--red)}
aside .grp.gives h4{color:var(--green)}
aside ul{list-style:none;font-size:15px;line-height:1.42;color:#C4D9DE}
aside li{padding:2px 0 2px 16px;position:relative}
aside li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
aside .dots{margin-top:auto;padding-top:14px;display:flex;gap:6px;flex-wrap:wrap}
aside .dots i{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);cursor:pointer;transition:.3s}
aside .dots i.done{background:rgba(0,229,212,.5)} aside .dots i.cur{background:var(--teal);box-shadow:0 0 10px var(--teal)}
footer{padding:4px 22px 10px;color:var(--dim);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer kbd{border:1px solid var(--dim);border-radius:5px;padding:0 6px;color:var(--muted);font-size:12px}
#bar{height:3px;background:var(--teal);width:0;position:fixed;left:0;bottom:0;transition:width linear;box-shadow:0 0 10px var(--teal)}
/* svg parts */
.hidden{opacity:0!important;pointer-events:none}
.el{transition:opacity .6s ease}
.node rect.body{fill:rgba(8,30,38,.96);stroke-width:2;transition:.35s}
.node .ttl{font:700 21px Inter,sans-serif;fill:#fff}
.node .sub{font:500 14.5px Inter,sans-serif;fill:var(--muted)}
.node .badge{font:800 12px Inter,sans-serif;letter-spacing:.1em}
.node.hl rect.body{filter:drop-shadow(0 0 14px var(--c));stroke-width:3.5}
.node.hl{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.035)}100%{transform:scale(1)}}
.node{transform-box:fill-box;transform-origin:center}
.lane{fill:none;stroke:var(--line);stroke-dasharray:3 6}
.lanelbl{font:700 12px Inter,sans-serif;letter-spacing:.14em;fill:var(--dim);text-transform:uppercase}
.edge{fill:none;stroke-width:2.4;stroke-linecap:round;opacity:.75;transition:.4s}
.edge.dash{stroke-dasharray:6 7}
.edge.hl{stroke-width:4;opacity:1;stroke-dasharray:10 8;animation:dash 1s linear infinite;filter:drop-shadow(0 0 5px currentColor)}
@keyframes dash{to{stroke-dashoffset:-36}}
.elbl{font:600 14px Inter,sans-serif;fill:var(--muted);paint-order:stroke;stroke:#03121a;stroke-width:5px;stroke-linejoin:round}
.chip rect{fill:#0d1830;stroke:var(--violet);stroke-width:1.6;transition:.35s}
.chip text{font:700 15px Inter,sans-serif;fill:#E4D6FF}
.chip .s{font:500 12.5px Inter,sans-serif;fill:var(--muted)}
.chip.hl rect{fill:#2a2050;stroke-width:3;filter:drop-shadow(0 0 12px var(--violet))}
.token{filter:drop-shadow(0 0 9px currentColor)}
.gn circle{stroke-width:2.4;fill:#061821;transition:.4s}
.gn text{font:600 13px Inter,sans-serif;fill:#EAF6F8;text-anchor:middle;paint-order:stroke;stroke:#03121a;stroke-width:4px}
.gn.hl circle{filter:drop-shadow(0 0 12px currentColor);stroke-width:4}
.gn.fresh{animation:born 1s ease-out}
@keyframes born{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.gn{transform-box:fill-box;transform-origin:center}
.ge{stroke:#5C7C87;stroke-width:1.8;fill:none;transition:.5s}
.ge.hl{stroke:var(--gold);stroke-width:3.5;filter:drop-shadow(0 0 6px var(--gold))}
.ge.draw{animation:draw 1s ease-out forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.callout rect{fill:rgba(245,197,24,.12);stroke:var(--gold);stroke-width:2}
.callout text{font:700 16px Inter,sans-serif;fill:#FFE9A0}
.callout .s{font:500 13.5px Inter,sans-serif;fill:#E8D9A5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;opacity:0;transform:translateY(14px);transition:.6s;display:flex;flex-direction:column;gap:6px}
.card.in{opacity:1;transform:none}
.card .k{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.card h3{font-size:19px;line-height:1.2}
.card p{font-size:14.5px;line-height:1.42;color:#C4D9DE}
.card .eff{margin-top:auto;font-size:13.5px;color:var(--green);border-top:1px dashed var(--line);padding-top:8px}
.card .eff b{color:#fff}
.stat{grid-column:1/-1;display:flex;gap:28px;justify-content:space-around;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(0,229,212,.05)}
.stat div{text-align:center}.stat b{font-size:28px;color:var(--teal);display:block;font-family:"Space Grotesk",Inter,sans-serif}.stat span{font-size:12.5px;color:var(--muted)}
@media (max-width:1100px){main{grid-template-columns:1fr;grid-template-rows:55vh auto;overflow:auto} body{overflow:auto} #cards{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const C = {op:"#F1F7F6", disp:"#4EA1FF", ana:"#00E5D4", ins:"#F5C518", wri:"#FF6A2B", mcp:"#3DDC97", mem:"#B48CFF", red:"#FF5C5C"};
const svg = document.getElementById("svg"), cardsEl = document.getElementById("cards"), cap = document.getElementById("cap");

/* ---------- tiny SVG helpers ---------- */
function E(tag, attrs = {}, parent = svg, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  parent.appendChild(n); return n;
}
const REG = {};                       // id -> element of the current scene
function reg(id, el) { el.classList.add("el"); REG[id] = el; return el; }
function node(id, x, y, w, h, color, title, sub, badge) {
  const g = E("g", {class: "node", transform: `translate(${x - w / 2},${y - h / 2})`});
  g.style.setProperty("--c", color);
  const r = E("rect", {class: "body", width: w, height: h, rx: 16, stroke: color}, g);
  E("text", {class: "ttl", x: 16, y: sub ? h / 2 - 2 : h / 2 + 7}, g, title);
  if (sub) E("text", {class: "sub", x: 16, y: h / 2 + 22}, g, sub);
  if (badge) { const b = E("text", {class: "badge", x: w - 14, y: 22, "text-anchor": "end", fill: color}, g, badge); }
  g.dataset.cx = x; g.dataset.cy = y;
  return reg(id, g);
}
function edge(id, d, color, opts = {}) {
  const p = E("path", {class: "edge" + (opts.dash ? " dash" : ""), d, stroke: color});
  if (opts.arrow !== false) p.setAttribute("marker-end", "url(#a-" + color.slice(1) + ")");
  p.style.color = color; return reg(id, p);
}
function lbl(id, x, y, t, anchor = "middle") { return reg(id, E("text", {class: "elbl", x, y, "text-anchor": anchor}, svg, t)); }
function chip(id, x, y, w, h, title, sub) {
  const g = E("g", {class: "chip", transform: `translate(${x},${y})`});
  E("rect", {width: w, height: h, rx: 13}, g);
  E("text", {x: w / 2, y: sub ? h / 2 - 1 : h / 2 + 5, "text-anchor": "middle"}, g, title);
  if (sub) E("text", {class: "s", x: w / 2, y: h / 2 + 17, "text-anchor": "middle"}, g, sub);
  return reg(id, g);
}
function lane(y, text) { E("line", {class: "lane", x1: 0, x2: 1240, y1: y, y2: y}); E("text", {class: "lanelbl", x: 14, y: y - 8}, svg, text); }
function defs() {
  const d = E("defs");
  for (const c of Object.values(C)) {
    const m = E("marker", {id: "a-" + c.slice(1), viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse"}, d);
    E("path", {d: "M0,0 L10,5 L0,10 z", fill: c}, m);
  }
  const m2 = E("marker", {id: "a-5C7C87", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse"}, d);
  E("path", {d: "M0,0 L10,5 L0,10 z", fill: "#5C7C87"}, m2);
}

/* ---------- token flight along a path ---------- */
let GEN = 0;
function fly(pathId, color, dur = 1100, label) {
  const my = GEN, p = REG[pathId]; if (!p) return Promise.resolve();
  const len = p.getTotalLength();
  const g = E("g", {class: "token"}); g.style.color = color;
  E("circle", {r: 9, fill: color}, g);
  if (label) E("text", {class: "elbl", y: -16, "text-anchor": "middle", style: "font-size:13px;fill:#fff"}, g, label);
  return new Promise(res => {
    const t0 = performance.now();
    (function tick(now) {
      if (my !== GEN) { g.remove(); return res(); }
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = p.getPointAtLength(len * e); g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
      if (k < 1) requestAnimationFrame(tick); else { g.remove(); res(); }
    })(t0);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function seq(list) { const my = GEN; for (const f of list) { if (my !== GEN) return; await f(); } }

/* =====================================================================

  edge("e_da", "M560,226 C540,262 500,272 480,308", C.disp); lbl("l_da", 500, 268, "objective + route", "end");
  edge("e_di", "M700,226 C720,262 760,272 780,308", C.disp, {dash: true}); lbl("l_di", 760, 268, "objective = yardstick", "start");
  edge("e_ai", "M572,338 L688,338", C.ana); lbl("l_ai", 630, 326, "facts", "middle");
  edge("e_ia", "M688,366 L572,366", C.ins, {dash: true}); lbl("l_ia", 630, 388, "revise", "middle");
  edge("e_iw", "M800,392 C800,450 770,470 730,486", C.ins); lbl("l_iw", 815, 450, "verdict + verified facts", "start");
  edge("e_wo", "M480,520 C310,520 310,84 480,84", C.wri, {dash: true}); lbl("l_wo", 330, 300, "brief · confidence · sources", "end");
  node("n_op", 630, 84, 300, 64, C.op, "Operator", "asks · decides · gives feedback", "HUMAN");

  {title: "Similar cases: the knowledge graph", kicker: "Inspector ← graph", text: "Every accepted answer becomes a case: problem → answer → actions and options, linked to categories, stations and lines. The Inspector sees similar past cases when it judges a result.", show: ["l_ig", "g_frame", "g_ftitle", "g_fsub", "g_cat", "g_pA", "g_aA", "g_actA", "g_stA", "ge_1", "ge_2", "ge_3", "ge_4"], hl: ["a_ins", "l_ig", "g_pA", "g_aA", "g_actA", "ge_2", "ge_3"],
   groups: [["Contribution", ["Cold start: seeded with the 26 recorded closures and their reroutes", "Categorised by situation and domain — no mixing of topics", "Grows with every accepted answer"]]]},
  {title: "Writing: what did operators do last time?", kicker: "Writer ← feedback + graph", text: "When a similar situation (same line or stations) has an action report, the brief carries one line: what operators did and how it went.", show: ["l_wf", "l_wg"], hl: ["a_wri", "st_fb", "l_wf", "l_wg"],
   groups: [["Contribution", ["Advice is grounded in real operator practice", "A precedent needs the same line or station — never a look-alike from elsewhere"]]]},
  {title: "After the answer: write back", kicker: "memory grows", text: "The turn and its artifact bundle (plan, every tool call, checks, confidence reasons) go to the turn history. The accepted case is added to the graph. Cognee mirroring is opt-in.", show: ["ge_5", "ge_6", "ge_7", "ge_8", "ge_9", "ge_10", "g_pB", "g_aB", "g_actB", "g_ln", "g_art"], hl: ["st_his", "g_pB", "g_aB", "g_actB", "g_ln", "g_art", "ge_5", "ge_6", "ge_7", "ge_8", "ge_9", "ge_10"], fresh: ["g_pB", "g_aB", "g_actB", "g_ln", "g_art"],
   run: () => seq([() => fly("l_wr", C.mem, 1400, "artifact")]),
   groups: [["Stored", ["turn + facts + plan + verdict", "artifact: tools · checks · confidence · report", "graph: Problem · Answer · Action · Line · Station · Artifact"]]]},
  {title: "The operator's feedback joins the graph", kicker: "loop closed", text: "A rating and a short “what I did” report attach to the situation. The stations and lines named in the text are linked automatically.", show: ["g_fb", "g_oa", "ge_11", "ge_12", "ge_13"], hl: ["st_fb", "g_fb", "g_oa", "ge_11", "ge_12", "ge_13"], fresh: ["g_fb", "g_oa"],
   groups: [["Stored", ["score 1–5 · comment", "action text · followed? · outcome (worked / partly / did not work)"]]]},
  {title: "The next similar question is better", kicker: "the compounding effect", text: "A new U7 closure finds the earlier situation, and the brief shows what worked. Bad answers stay out; good ones and real actions accumulate.", show: ["g_pC", "ge_14", "ge_15", "g_prec"], hl: ["g_pC", "ge_14", "g_pB", "ge_11", "ge_12", "g_oa", "g_prec", "a_wri"], fresh: ["g_pC"],
   groups: [["Result", ["Faster (reuse) · safer (checked) · more practical (precedents)", "Each answer is traceable to its artifact"]]]},
];

/* =====================================================================
   SCENE 4 — why it works better
   ===================================================================== */
const CARDS = [
  ["Dispatcher", C.disp, "Scope + routing", "Off-topic, manipulation and unsupported questions never reach the tools; the right playbook runs for the rest.", "no wasted calls · honest declines"],
  ["Analyst", C.ana, "Facts from tools", "Numbers come from deterministic MCP tools and TabPFN forecasts, with confidence and stated assumptions.", "traceable numbers"],
  ["Inspector", C.ins, "Verify before showing", "Ground truth, knowledge-base boundaries and the quality database are checked before the Writer sees anything.", "hallucinated numbers blocked"],
  ["Writer", C.wri, "One screen, no inventions", "A short brief; the number guard replaces the text by a template if a figure is not in the facts.", "readable in seconds"],
  ["Session memory", C.mem, "Continue, don't restart", "Follow-ups (“why?”, “what about 22:30?”) start from the earlier plan and facts.", "shorter dialogue"],
  ["Turn history", C.mem, "Reuse what was accepted", "An identical accepted answer within 24 h is served instantly; poorly rated answers are never reused.", "0 s repeat answers"],
  ["Knowledge base", C.mem, "Ground truth + limits", "Recomputed from the raw CSVs; states what the data cannot support.", "safe boundaries"],
  ["Knowledge graph", C.mem, "Cases, situations, precedents", "Problems linked to answers, actions and options; seeded with recorded closures; grows with every accepted answer.", "similar cases in the check"],
  ["Operator feedback", C.mem, "Practice, not just theory", "Ratings and action reports become precedents: what operators did and how it went.", "advice from real practice"],
];
function buildCards() {
  cardsEl.innerHTML = "";
  CARDS.forEach(([k, col, h, p, eff], i) => {
    const d = document.createElement("div"); d.className = "card"; d.style.borderColor = col + "66"; d.style.transitionDelay = (i * 90) + "ms";
    d.innerHTML = `<div class="k" style="color:${col}">${k}</div><h3>${h}</h3><p>${p}</p><div class="eff">Effect: <b>${eff}</b></div>`;
    cardsEl.appendChild(d);
  });
  const s = document.createElement("div"); s.className = "stat"; s.innerHTML =
    `<div><b>57</b><span>MCP tools in 3 servers</span></div><div><b>≈ 3.7 s</b><span>median answer, reference run on the organiser's workbook</span></div><div><b>46 / 46</b><span>guardrail decisions (no LLM)</span></div><div><b>137</b><span>offline tests</span></div><div><b>0 s</b><span>repeat of an accepted answer</span></div>`;
  cardsEl.appendChild(s);
}
const WHY = [{title: "Why the team works better together", kicker: "the result", text: "Separation of duties makes answers checkable; memory and the knowledge graph make each answer better than the last. The operator stays in charge.", cards: true,
  groups: [["In one sentence", ["Decide → do → check → communicate, with memory feeding every step and feedback feeding the memory."]]]}];

/* =====================================================================
   engine
   ===================================================================== */
const SCENES = [
  {id: "team", name: "Team & hierarchy", build: buildTeam, steps: TEAM},
  {id: "flow", name: "One question, step by step", build: buildFlow, steps: FLOW},
  {id: "mem", name: "Memory & knowledge graph", build: buildMemory, steps: MEM},
  {id: "why", name: "Why it works", build: null, steps: WHY},
];
const TRANSIENT = new Set(["g_call"]);
let sc = 0, st = 0, auto = false, timer = null;

function esc(s) { return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }
function renderCaption() {
  const S = SCENES[sc].steps[st];
  const cls = ["", "gives", "never"];
  const groups = (S.groups || []).map(([h, items]) => `<div class="grp ${/^never/i.test(h) ? "never" : /^(returns|gets back|stored|result|contribution|adds|verdict|guarantees)/i.test(h) ? "gives" : ""}"><h4>${esc(h)}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
  cap.innerHTML = `<div class="kicker">${esc(S.kicker || "")}</div><h2>${esc(S.title)}</h2><p>${esc(S.text)}</p>${groups}<div class="dots">${SCENES[sc].steps.map((_, i) => `<i class="${i < st ? "done" : i === st ? "cur" : ""}" data-i="${i}"></i>`).join("")}</div>`;
  cap.querySelectorAll(".dots i").forEach(d => d.onclick = () => go(sc, +d.dataset.i));
  cap.scrollTop = 0;
}
function build(i) {
  GEN++; svg.innerHTML = ""; for (const k in REG) delete REG[k];
  const S = SCENES[i];
  const isCards = !S.build;
  svg.style.display = isCards ? "none" : "block"; cardsEl.style.display = isCards ? "grid" : "none";
  if (isCards) { buildCards(); return; }
  defs(); S.build();
}
function apply() {
  const steps = SCENES[sc].steps, S = steps[st];
  const shown = new Set(); steps.slice(0, st + 1).forEach(s => (s.show || []).forEach(id => shown.add(id)));
  for (const id in REG) {
    const el = REG[id]; if (id.startsWith("pos_")) continue;
    el.classList.toggle("hidden", !(shown.has(id) && (!TRANSIENT.has(id) || (S.show || []).includes(id))));
    el.classList.toggle("hl", (S.hl || []).includes(id));
    el.classList.remove("fresh");
    if (el.classList.contains("ge")) el.style.strokeDashoffset = shown.has(id) ? 0 : el.style.getPropertyValue("--len");
  }
  // memory chips lit in the team scene when asked
  if (S.mem) ["g_mem"].forEach(id => REG[id] && REG[id].classList.add("hl"));
  (S.fresh || []).forEach(id => { const el = REG[id]; if (el) { void el.getBoundingClientRect(); el.classList.add("fresh"); } });
  // freshly drawn graph edges
  (S.show || []).forEach(id => { const el = REG[id]; if (el && el.classList && el.classList.contains("ge") && steps.slice(0, st).every(p => !(p.show || []).includes(id))) { el.style.strokeDashoffset = el.style.getPropertyValue("--len"); requestAnimationFrame(() => { el.style.transition = "stroke-dashoffset 1s ease-out"; el.style.strokeDashoffset = 0; }); } });
  if (SCENES[sc].steps === WHY) requestAnimationFrame(() => cardsEl.querySelectorAll(".card").forEach(c => c.classList.add("in")));
  if (S.run) S.run();
}
let built = -1;
function go(s, i) {
  if (built !== s) { build(s); built = s; }
  sc = s; st = i; GEN++;
  document.querySelectorAll("#nav button").forEach((b, k) => b.classList.toggle("on", k === sc));
  renderCaption(); apply(); schedule();
}
function next() { const S = SCENES[sc]; if (st < S.steps.length - 1) go(sc, st + 1); else go((sc + 1) % SCENES.length, 0); }
function prev() { if (st > 0) go(sc, st - 1); else { const p = (sc + SCENES.length - 1) % SCENES.length; go(p, SCENES[p].steps.length - 1); } }
function schedule() {
  clearTimeout(timer); const bar = document.getElementById("bar"); bar.style.transition = "none"; bar.style.width = "0";
  if (!auto) return;
  const ms = 7500; requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${ms}ms linear`; bar.style.width = "100%"; }));
  timer = setTimeout(next, ms);
}
document.getElementById("nav").innerHTML = SCENES.map((s, i) => `<button data-i="${i}"><b>${i + 1}</b>${s.name}</button>`).join("");
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(+b.dataset.i, 0));
document.getElementById("next").onclick = next; document.getElementById("prev").onclick = prev;
document.getElementById("auto").onclick = e => { auto = !auto; e.target.classList.toggle("on", auto); schedule(); };
document.getElementById("full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (/^[1-4]$/.test(e.key)) go(+e.key - 1, 0);
  else if (e.key.toLowerCase() === "a") document.getElementById("auto").click();
  else if (e.key.toLowerCase() === "f") document.getElementById("full").click();
});
go(0, 0);
</script>
